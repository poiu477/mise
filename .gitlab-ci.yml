# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
    when: never
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  - if: "$CI_COMMIT_TAG"
include:
- template: Jobs/Secret-Detection.gitlab-ci.yml
- template: Security/SAST.gitlab-ci.yml
secret_detection:
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - when: on_success
stages:
- test
variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  POSTGRES_USER: mise
  POSTGRES_PASSWORD: mise
  POSTGRES_DB: mise
  DATABASE_URL: postgres://mise:mise@postgres:5432/mise
default:
  interruptible: true
".check":
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - when: on_success
".weekly":
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "weekly"
  interruptible: false
".rust":
  image: rust:1.99.1-bookworm
  cache:
    key:
      files:
      - Cargo.lock
      - rust-toolchain.toml
    paths:
    - ".cargo/registry/index"
    - ".cargo/registry/cache"
    - ".cargo/git/db"
    - ".cargo/bin"
    - target/
".node":
  image: node:26-bookworm
  cache:
    key:
      files:
      - web/package-lock.json
    paths:
    - ".npm/"
".postgres":
  services:
  - name: postgres:16
    alias: postgres
rust:
  extends:
  - ".check"
  - ".rust"
  - ".postgres"
  stage: test
  script:
  - rustup show active-toolchain
  - cargo fmt --all --check
  - cargo clippy --workspace --all-targets --locked -- -D warnings
  - cargo test --workspace --locked
  - cargo run -q --locked -p mise-api -- openapi > web/openapi.json
  - cargo build --locked -p mise-cli -p mise-api
  artifacts:
    paths:
    - web/openapi.json
    - target/debug/mise
    - target/debug/mise-server
    expire_in: 1 day
api types:
  extends:
  - ".check"
  - ".node"
  stage: test
  needs:
  - rust
  script:
  - cd web && npm ci --no-audit --no-fund
  - node scripts/check-openapi.mjs
  - npx openapi-typescript openapi.json -o src/api/schema.d.ts
  - git diff --exit-code -- src/api/schema.d.ts || { echo "web/src/api/schema.d.ts
    is out of date; run 'npm run api' in web/"; exit 1; }
web:
  extends:
  - ".check"
  - ".node"
  stage: test
  needs: []
  script:
  - cd web && npm ci --no-audit --no-fund
  - npm run format:check
  - npm run lint
  - npm test
  - npm run build
  - npm audit --omit=dev --audit-level=high
browser journeys:
  extends:
  - ".check"
  - ".node"
  - ".postgres"
  stage: test
  needs:
  - rust
  script:
  - cd web && npm ci --no-audit --no-fund
  - npm run build
  - npx playwright install --with-deps chromium
  - npm run e2e
  artifacts:
    when: on_failure
    paths:
    - web/playwright-report/
    - web/test-results/
    expire_in: 14 days
rust dependencies:
  extends:
  - ".check"
  - ".rust"
  stage: test
  needs: []
  script:
  - cargo deny --version 2>/dev/null | grep -q '^cargo-deny 0\.20\.2$' || cargo install
    cargo-deny --version 0.20.2 --locked
  - cargo deny check
docker image:
  extends: ".check"
  image: docker:29-cli
  services:
  - name: docker:29-dind
    alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: '1'
  stage: test
  needs: []
  script:
  - docker build --tag mise:ci .
renovate config:
  image: renovate/renovate:44.222.4
  stage: test
  needs: []
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - changes:
    - renovate.json
  script:
  - renovate-config-validator --strict renovate.json
renovate:
  extends: ".weekly"
  image: renovate/renovate:44.222.4
  stage: test
  needs: []
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "$CI_API_V4_URL"
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    RENOVATE_ONBOARDING: 'false'
    RENOVATE_REQUIRE_CONFIG: required
    LOG_LEVEL: info
  script:
  - renovate
typescript watch:
  extends:
  - ".weekly"
  - ".node"
  stage: test
  needs: []
  script:
  - cd web && npm ci --no-audit --no-fund
  - npm run -s typescript:ready | node scripts/typescript-issue.mjs
sast:
  stage: test
