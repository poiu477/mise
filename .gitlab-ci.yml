# CI for every merge request and every push to main: formatting, lints, tests, the Rust docs (published to GitLab
# Pages from main), the web build, dependency checks, the Docker image and Rust SAST. A merge request merges only when
# all of it passes. The steps are the ones ./check runs locally, with the same commands and flags;
# .github/workflows/ci.yml runs them again on the GitHub mirror after each push to main. Change all three together.
#
# The other security scans (GitLab Advanced SAST, dependency scanning, secret detection) come from the project's
# security configuration profiles (Secure, Security configuration), not from this file, and run in the same
# pipelines. A merge request approval policy (Personal/mise-security-policy-project) holds a merge request that adds
# a high or critical SAST finding until the maintainer approves it.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request already gets the merge request's pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Pushes to main, and the daily schedule on main (Renovate and the TypeScript watch; see the end of this file).
    # A newer push never cancels main's pipeline, so every merge gets its full run and its scans become the baseline
    # the next merge request's findings are compared with.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_TAG

stages:
  - test

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  # Incremental builds only help when the same files are rebuilt in place; in CI they just make target/ (and the cache
  # that carries it) much bigger.
  CARGO_INCREMENTAL: "0"
  # Faster cache and artifact archives: target/ is large, and the runner keeps its caches locally.
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fast
  ARTIFACT_COMPRESSION_LEVEL: fast
  npm_config_cache: $CI_PROJECT_DIR/.npm
  # The postgres service, for the jobs that list it.
  POSTGRES_USER: mise
  POSTGRES_PASSWORD: mise
  POSTGRES_DB: mise
  # The API tests and the browser journeys each make a database of their own on this server.
  DATABASE_URL: postgres://mise:mise@postgres:5432/mise

default:
  # A newer push to a merge request cancels the older pipeline's jobs; main's pipelines all run to the end (see
  # workflow above).
  interruptible: true

# The checks: every merge request and push, never the dependency schedule.
.check:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# The dependency schedule's jobs. The schedule (Build, Pipeline schedules) runs daily on main and sets
# SCHEDULE=dependencies; renovate.json keeps ordinary updates to Mondays and lets security fixes through any day.
.scheduled:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "dependencies"
  interruptible: false

# Two caches, keyed on the Rust version only, so a dependency update reuses everything it didn't change instead of
# starting cold: the crates cargo downloads, and target/ (written only by the rust job). Raising Rust starts both
# afresh; to trim target/ in between, clear the runner caches (Build, Pipelines, Clear runner caches).
.cargo home cache: &cargo-home-cache
  key:
    prefix: cargo-home
    files: [rust-toolchain.toml]
  paths: [.cargo/registry/index, .cargo/registry/cache, .cargo/git/db]

.rust:
  image: rust:1.99.1-bookworm
  cache:
    - *cargo-home-cache
    - key:
        prefix: target
        files: [rust-toolchain.toml]
      paths: [target/]

.node:
  image: node:26-bookworm
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.npm/]

.postgres:
  services:
    - name: postgres:16
      alias: postgres

rust:
  extends: [.check, .rust, .postgres]
  stage: test
  script:
    - rustup show active-toolchain
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo test --workspace --locked
    # For the jobs after this one: the API document, and the binaries the browser journeys run.
    - cargo run -q --locked -p mise-api -- openapi > web/openapi.json
    - cargo build --locked -p mise-cli -p mise-api
  artifacts:
    paths: [web/openapi.json, target/debug/mise, target/debug/mise-server]
    expire_in: 1 day

# The Rust documentation, with warnings as errors, so a broken intra-doc link or bad doc markup fails it. On a merge
# request (and a tag) `rust docs` only checks it; on main `pages` builds the same thing and publishes it to GitLab
# Pages, so main builds it once. Both read the rust job's caches without writing them back.
.rust docs:
  extends: .rust
  stage: test
  needs: []
  cache:
    - <<: *cargo-home-cache
      policy: pull
    - key:
        prefix: target
        files: [rust-toolchain.toml]
      paths: [target/]
      policy: pull
  variables:
    RUSTDOCFLAGS: -D warnings
  script:
    - cargo doc --workspace --no-deps --locked

rust docs:
  extends: .rust docs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: on_success

pages:
  extends: .rust docs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - !reference [.rust docs, script]
    # rustdoc makes no page at the root without nightly's --enable-index-page; this one opens mise-core, whose
    # sidebar lists the other crates.
    - cp -r target/doc public
    - |
      cat > public/index.html <<'EOF'
      <!doctype html>
      <meta charset="utf-8">
      <title>mise: Rust documentation</title>
      <meta http-equiv="refresh" content="0; url=mise_core/index.html">
      <link rel="canonical" href="mise_core/index.html">
      <p><a href="mise_core/index.html">mise-core's documentation</a></p>
      EOF
  artifacts:
    paths: [public]
    expire_in: 1 day

api types:
  extends: [.check, .node]
  stage: test
  needs: [rust]
  script:
    - cd web && npm ci --no-audit --no-fund
    - node scripts/check-openapi.mjs
    - npx openapi-typescript openapi.json -o src/api/schema.d.ts
    - git diff --exit-code -- src/api/schema.d.ts
      || { echo "web/src/api/schema.d.ts is out of date; run 'npm run api' in web/"; exit 1; }

web:
  extends: [.check, .node]
  stage: test
  needs: []
  script:
    - cd web && npm ci --no-audit --no-fund
    - npm run format:check
    - npm run lint
    - npm test
    - npm run build
    - npm audit --omit=dev --audit-level=high

browser journeys:
  extends: [.check, .node, .postgres]
  stage: test
  needs: [rust]
  script:
    - cd web && npm ci --no-audit --no-fund
    - npm run build
    - npx playwright install --with-deps chromium
    - npm run e2e
  artifacts:
    when: on_failure
    paths: [web/playwright-report/, web/test-results/]
    expire_in: 14 days

rust dependencies:
  extends: [.check, .rust]
  stage: test
  needs: []
  # It builds nothing, so it reads the downloaded crates without saving them back, and keeps only its own binary.
  cache:
    - <<: *cargo-home-cache
      policy: pull
    - key: cargo-deny-0.20.2
      paths: [.cargo/bin]
  script:
    # Advisories, licenses, bans and sources (deny.toml).
    - cargo deny --version 2>/dev/null | grep -q '^cargo-deny 0\.20\.2$'
      || cargo install cargo-deny --version 0.20.2 --locked
    - cargo deny check

docker image:
  # Builds the image, then runs the stack as docs/deploy.md sets it up with the stack's own Caddy (the https profile)
  # and a certificate from Caddy's own authority, and checks it as a phone would see it: /api/health over HTTPS with
  # Caddy's root trusted, plain HTTP redirected to HTTPS, and a Secure session cookie from signing in. The first
  # account is a throwaway made on the empty database, which goes with the job.
  #
  # The rust and web jobs already prove the code compiles and the web app builds, so this release build only adds the
  # image itself. On a merge request it runs only when something the image build or the stack depends on changes; on
  # main and on tags it always runs, so nothing gets past it for longer than one merge.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - .dockerignore
        - Cargo.toml
        - Cargo.lock
        - crates/*/Cargo.toml
        - rust-toolchain.toml
        - web/package.json
        - web/package-lock.json
        - compose.yaml
        - Caddyfile
        - .gitlab/compose.ci.yaml
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success
  # Runs on a runner that lends jobs its own Docker through the socket (docs/development.md, "CI runners"), not on
  # Docker-in-Docker: no privileged containers, and the build cache stays between runs. Everything this job starts
  # shares that Docker with other jobs, so it carries the job's id in its name and is removed at the end.
  tags: [docker-socket]
  image: docker:29-cli
  variables:
    MISE_IMAGE: mise:ci-$CI_JOB_ID
    COMPOSE_PROJECT_NAME: mise-ci-$CI_JOB_ID
    # .gitlab/compose.ci.yaml takes away the published ports and the folders on the host (see there).
    COMPOSE_FILE: compose.yaml:.gitlab/compose.ci.yaml
    COMPOSE_PROFILES: https
    # A container on the stack's network that makes the requests, as a phone would through Caddy.
    PROBE: mise-ci-$CI_JOB_ID-probe
    TO_STACK: "--connect-to ::caddy:"
    # The stack's settings, as .env would hold them on a server (POSTGRES_PASSWORD is set for the whole pipeline).
    MISE_HOST: mise.example.com
    MISE_TLS: internal
    PUBLIC_BASE_URL: https://mise.example.com
  stage: test
  needs: []
  script:
    - docker build --tag "$MISE_IMAGE" .
    # Created first so the Caddyfile can be copied in: the runner's Docker can't see this checkout to bind-mount it.
    - docker compose create
    - docker compose cp Caddyfile caddy:/etc/caddy/Caddyfile
    - docker compose up --detach --no-build --wait --wait-timeout 180
    - >-
      docker run --detach --name "$PROBE" --network "${COMPOSE_PROJECT_NAME}_default"
      --entrypoint sleep docker:29-cli 900
    - docker exec "$PROBE" apk add --no-cache curl
    - |
      for i in $(seq 30); do
        docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt caddy-root.crt 2>/dev/null && break
        sleep 2
      done
      test -s caddy-root.crt || { echo "Caddy made no root certificate"; exit 1; }
      docker cp caddy-root.crt "$PROBE":/caddy-root.crt
    # HTTPS, trusting only Caddy's root.
    - >-
      docker exec "$PROBE" curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2
      --cacert /caddy-root.crt $TO_STACK "https://$MISE_HOST/api/health"
    # Plain HTTP redirects to the same address over HTTPS.
    - |
      redirect=$(docker exec "$PROBE" curl --silent --show-error --output /dev/null \
        --write-out '%{http_code} %{redirect_url}' $TO_STACK "http://$MISE_HOST/api/health")
      echo "$redirect"
      test "$redirect" = "308 https://$MISE_HOST/api/health" || { echo "HTTP isn't redirected to HTTPS"; exit 1; }
    # Signing in (here the first account's setup) sets a Secure session cookie.
    - |
      docker exec "$PROBE" curl --fail --silent --show-error --cacert /caddy-root.crt $TO_STACK \
        --dump-header - --output /dev/null --header 'Content-Type: application/json' \
        --data "{\"username\":\"ci\",\"password\":\"$(head -c 18 /dev/urandom | base64)\"}" \
        "https://$MISE_HOST/api/auth/setup" > headers.txt
      grep -i '^set-cookie: mise_session=' headers.txt | sed 's/=[^;]*/=(value)/'
      grep -qi '^set-cookie: mise_session=.*; *secure' headers.txt \
        || { echo "The session cookie isn't Secure"; exit 1; }
  after_script:
    - '[ "$CI_JOB_STATUS" = success ] || docker compose logs --no-color'
    # Leave the runner's Docker as it was: this job's containers, volumes and image go; build cache older than a week
    # goes too, so the cache can't fill the disk.
    - docker rm --force "$PROBE" || true
    - docker compose down --volumes --remove-orphans || true
    - docker image rm --force "$MISE_IMAGE" || true
    - docker builder prune --force --filter until=168h || true

rust sast:
  # GitLab Advanced SAST doesn't read Rust, so this runs Semgrep's Rust rules and writes GitLab's SAST format. The
  # results join the other SAST reports: the merge request's security widget, the vulnerability report and the
  # approval policy. As with GitLab's own analyzers, findings don't fail the job. The report has a name of its own,
  # since two jobs writing one report file in the same build folder fail with "permission denied".
  extends: .check
  image:
    name: semgrep/semgrep:1.184.0
    entrypoint: [""]
  stage: test
  needs: []
  allow_failure: true
  variables:
    # The image expects the code in /src (docker run -v $PWD:/src); CI checks it out here instead.
    SEMGREP_SRC_DIRECTORY: $CI_PROJECT_DIR
  script:
    - semgrep scan --config p/rust --metrics=off --include '*.rs' --gitlab-sast --output gl-sast-rust-report.json
  artifacts:
    access: developer
    reports:
      sast: gl-sast-rust-report.json
    paths: [gl-sast-rust-report.json]
    expire_in: 30 days

renovate config:
  # Whenever renovate.json changes, check it the way Renovate will read it.
  image: renovate/renovate:44.227.0
  stage: test
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes: [renovate.json]
  script:
    - renovate-config-validator --strict renovate.json

# On the schedule: dependency updates (renovate.json says what and how they're grouped). RENOVATE_TOKEN is a
# masked, protected project variable: a project access token (role Developer, scope api) that Renovate pushes its
# branches and opens merge requests with. GITHUB_COM_TOKEN (optional, a GitHub token with no scopes) avoids
# github.com's rate limit when Renovate looks up the mirror's workflow actions and release notes.
renovate:
  extends: .scheduled
  image: renovate/renovate:44.227.0
  stage: test
  needs: []
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    LOG_LEVEL: info
  script:
    - renovate

# On the schedule: once every tool that depends on TypeScript accepts the next major, open one issue to lift
# the hold in renovate.json.
typescript watch:
  extends: [.scheduled, .node]
  stage: test
  needs: []
  script:
    - cd web && npm ci --no-audit --no-fund
    - npm run -s typescript:ready | node scripts/typescript-issue.mjs
