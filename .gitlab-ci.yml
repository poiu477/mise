# CI for every merge request and every push to main: formatting, lints, tests, the web build, dependency checks,
# the Docker image and secret detection. A merge request merges only when all of it passes. The steps are the ones
# ./check runs locally, with the same commands and flags; .github/workflows/ci.yml runs them again on the GitHub
# mirror after each push to main. Change all three together.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request already gets the merge request's pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

include:
  # GitLab's secret detection (Gitleaks) on every pipeline.
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  npm_config_cache: $CI_PROJECT_DIR/.npm
  # The postgres service, for the jobs that list it.
  POSTGRES_USER: mise
  POSTGRES_PASSWORD: mise
  POSTGRES_DB: mise
  # The API tests and the browser journeys each make a database of their own on this server.
  DATABASE_URL: postgres://mise:mise@postgres:5432/mise

default:
  # A newer push to a merge request cancels the older pipeline's jobs; main's pipelines all run to the end.
  interruptible: true

.rust:
  image: rust:1.99.1-bookworm
  cache:
    key:
      files: [Cargo.lock, rust-toolchain.toml]
    paths: [.cargo/registry/index, .cargo/registry/cache, .cargo/git/db, .cargo/bin, target/]

.node:
  image: node:26-bookworm
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.npm/]

.postgres:
  services:
    - name: postgres:16
      alias: postgres

rust:
  extends: [.rust, .postgres]
  stage: test
  script:
    - rustup show active-toolchain
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo test --workspace --locked
    # For the jobs after this one: the API document, and the binaries the browser journeys run.
    - cargo run -q --locked -p mise-api -- openapi > web/openapi.json
    - cargo build --locked -p mise-cli -p mise-api
  artifacts:
    paths: [web/openapi.json, target/debug/mise, target/debug/mise-server]
    expire_in: 1 day

api types:
  extends: .node
  stage: test
  needs: [rust]
  script:
    - cd web && npm ci --no-audit --no-fund
    - node scripts/check-openapi.mjs
    - npx openapi-typescript openapi.json -o src/api/schema.d.ts
    - git diff --exit-code -- src/api/schema.d.ts
      || { echo "web/src/api/schema.d.ts is out of date; run 'npm run api' in web/"; exit 1; }

web:
  extends: .node
  stage: test
  needs: []
  script:
    - cd web && npm ci --no-audit --no-fund
    - npm run format:check
    - npm run lint
    - npm test
    - npm run build
    - npm audit --omit=dev --audit-level=high

browser journeys:
  extends: [.node, .postgres]
  stage: test
  needs: [rust]
  script:
    - cd web && npm ci --no-audit --no-fund
    - npm run build
    - npx playwright install --with-deps chromium
    - npm run e2e
  artifacts:
    when: on_failure
    paths: [web/playwright-report/, web/test-results/]
    expire_in: 14 days

rust dependencies:
  extends: .rust
  stage: test
  needs: []
  script:
    # Advisories, licenses, bans and sources (deny.toml). The cache keeps the installed binary between runs.
    - cargo deny --version 2>/dev/null | grep -q '^cargo-deny 0\.20\.2$'
      || cargo install cargo-deny --version 0.20.2 --locked
    - cargo deny check

docker image:
  # Needs a runner that allows privileged jobs, for Docker-in-Docker.
  image: docker:29-cli
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
  stage: test
  needs: []
  script:
    - docker build --tag mise:ci .
