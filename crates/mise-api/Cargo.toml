[package]
name = "mise-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
mise-core = { version = "0.1.0", path = "../mise-core" }
mise-db = { version = "0.1.0", path = "../mise-db" }
openidconnect = { version = "4.1.0", features = ["reqwest"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
sqlx.workspace = true
thiserror = "2.0.21"
time = "0.3.47"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace", "compression-gzip", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
uuid.workspace = true

[[bin]]
name = "mise-server"
path = "src/main.rs"

[dev-dependencies]
# The fake OpenID Connect provider in tests/oidc.rs signs ID tokens with these, at the versions openidconnect uses.
ed25519-dalek = "3.0.0"
http-body-util = "0.1.5"
# tests/photos.rs draws a photo for the demo recipes and reads its web copies; as mise-ingest builds it.
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
# tests/common/demo.rs loads the demo recipes through the same stages as the `mise` command.
mise-ingest = { version = "0.1.0", path = "../mise-ingest" }
p256 = { version = "0.14.0", features = ["ecdsa"] }
rsa = { version = "0.9.10", features = ["sha2", "getrandom"] }
tower = { version = "0.5.3", features = ["util"] }
