[package]
name = "mise-ingest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
html5ever = "0.40.1"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
mise-core = { version = "0.1.0", path = "../mise-core" }
mise-db = { version = "0.1.0", path = "../mise-db" }
rayon = "1.12.0"
# Fetching a page to import. The same build of reqwest single sign-on already uses: rustls, no system proxy.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.1"
sqlx.workspace = true
strsim = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "net", "time"] }
tracing = "0.1.44"
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
# Test folders: private, and removed even when a test fails.
tempfile = "3.27.0"
# fetch's tests run a small web server of their own to fetch from.
tokio = { version = "1.54.1", features = ["macros", "io-util", "sync"] }
