# cargo deny: what CI accepts in the Rust dependency tree. https://embarkstudios.github.io/cargo-deny/

[advisories]
# Every RustSec advisory fails the build unless listed here with a reason.
ignore = [
    # The Marvin attack recovers an RSA private key by timing decryption or signing. mise uses rsa only through
    # openidconnect, to verify a sign-in provider's ID token signature with its public key, which handles no
    # secret. rsa 0.10 fixes it, but openidconnect 4.1.0 (the newest) still requires rsa 0.9, so it waits on an
    # openidconnect release: then raise openidconnect and the dev-dependency in crates/mise-api together, and drop
    # this. Review by 2027-05-01 in any case.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used only for public-key signature verification (openidconnect)" },
    # chrono is unmaintained: no known flaw, but no one will fix one. mise's own code can move to jiff or time
    # (backlog T34), but chrono stays in the tree regardless: oauth2 and openidconnect 4.1.0 (the newest) require
    # it. Drop this once they no longer do and T34 is done. Review by 2027-05-01 in any case.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable; openidconnect requires it (backlog T34)" },
]

[licenses]
# Permissive licenses only, so the project stays MIT-compatible.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
