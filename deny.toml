# cargo deny: what CI accepts in the Rust dependency tree. https://embarkstudios.github.io/cargo-deny/

[advisories]
# Every RustSec advisory fails the build unless listed here with a reason.
ignore = [
    # The Marvin attack recovers an RSA private key by timing decryption or signing. mise uses rsa only through
    # openidconnect, to verify a sign-in provider's ID token signature with its public key, which handles no
    # secret. No fixed release exists. Review by 2027-05-01, or sooner if a fixed rsa ships or openidconnect drops it.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used only for public-key signature verification (openidconnect)" },
]

[licenses]
# Permissive licenses only, so the project stays MIT-compatible.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
