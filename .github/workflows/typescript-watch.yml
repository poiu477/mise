# Dependabot holds TypeScript back a major version (see the ignore rule in dependabot.yml) until every web tool that
# depends on TypeScript accepts the new one. Each week this checks the tools' latest releases, and once none rejects
# the newest TypeScript it opens one issue to lift the hold. Removing the rule lets Dependabot propose the upgrade.
name: TypeScript major watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check TypeScript support
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Do the tools accept the newest TypeScript?
        id: check
        run: npm run -s typescript:ready >> "$GITHUB_OUTPUT"
      - name: Open an issue to lift the hold
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          title="TypeScript $VERSION is supported by our tools: lift the Dependabot hold"
          open=$(gh issue list --state open --search "\"lift the Dependabot hold\" in:title" --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "An issue to lift the hold is already open."
            exit 0
          fi
          gh issue create --title "$title" --body "Every web dependency that declares a TypeScript peer range now accepts TypeScript $VERSION (checked by \`npm run typescript:ready\` in \`web/\`).

          To upgrade: delete the \`typescript\` ignore rule from \`.github/dependabot.yml\`. Dependabot then opens the upgrade pull request on its next run, and CI checks it."
