# Every push to main and every pull request: formatting, lints, tests, the web build, dependency checks and the
# Docker image. A pull request merges only when all of it passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mise
          POSTGRES_PASSWORD: mise
          POSTGRES_DB: mise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mise -d mise"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The API tests create and drop a database of their own each.
      DATABASE_URL: postgres://mise:mise@localhost:5432/mise
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web API types match the server
        run: |
          cargo run -q --locked -p mise-api -- openapi > web/openapi.json
          cd web && npm ci --no-audit --no-fund
          npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::web/src/api/schema.d.ts is out of date: run 'npm run api' in web/"; exit 1; }

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  dependencies:
    name: Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advisories, licenses, bans and sources (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.99.1"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mise:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
