# The GitHub mirror's CI: the same formatting, lints, tests, web build, dependency checks and Docker image as
# .gitlab-ci.yml, which gates merges on GitLab. It runs again here after each push to main as a second opinion.
# Actions are pinned to full commit SHAs (Renovate keeps them current), and checkout leaves no credentials behind
# for later steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. On main every commit gets a group of its own, so none is
# skipped: within one group GitHub keeps a single waiting run and cancels the one before it, even without
# cancel-in-progress.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mise
          POSTGRES_PASSWORD: mise
          POSTGRES_DB: mise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mise -d mise"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The API tests create and drop a database of their own each.
      DATABASE_URL: postgres://mise:mise@localhost:5432/mise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: API document is valid and the web types match it
        run: |
          cargo run -q --locked -p mise-api -- openapi > web/openapi.json
          cd web && npm ci --no-audit --no-fund
          node scripts/check-openapi.mjs
          npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::web/src/api/schema.d.ts is out of date: run 'npm run api' in web/"; exit 1; }

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mise
          POSTGRES_PASSWORD: mise
          POSTGRES_DB: mise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mise -d mise"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # e2e/serve.mjs builds the demo install in a database of its own on this server.
      DATABASE_URL: postgres://mise:mise@localhost:5432/mise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build mise and mise-server
        run: cargo build --locked -p mise-cli -p mise-api
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Journeys
        working-directory: web
        run: npm run e2e
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  dependencies:
    name: Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Advisories, licenses, bans and sources (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: mise:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
