# Weekly update pull requests for Rust crates, npm packages, GitHub Actions and the Docker base images, grouped so
# each ecosystem arrives as one pull request.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Held until every tool that depends on TypeScript (openapi-typescript, typescript-eslint) accepts the next
      # major. The "TypeScript major watch" workflow opens an issue when they do; then delete this rule.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Rust is raised by hand, in rust-toolchain.toml, the Dockerfile and Cargo.toml together.
      - dependency-name: rust
