[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
# Dates and times: a date in ISO form ("2026-11-23") through serde, timestamps as RFC 3339 by `time::serde::rfc3339`.
time = { version = "0.3.47", features = ["serde-human-readable", "macros"] }

[profile.dev.package.sqlx-macros]
opt-level = 3

# RSA key generation in the single sign-on tests takes minutes unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3
